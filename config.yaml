# ─────────────────────────────────────────────────────────────────────────────
# Elder Trades — single source of truth.
#
# Everything (bot, risk engine, backtester) reads this file. Nothing hard-codes
# an account size or a risk limit. This is what stops the $5K / $100K / $1M
# contradiction that ran through the original three files.
# ─────────────────────────────────────────────────────────────────────────────

account:
  # Informational only. The risk engine reads LIVE equity from Alpaca every
  # scan and sizes off that. Reset your Alpaca paper account to this number in
  # the dashboard -- passing a balance on the command line does not change what
  # the broker thinks you have.
  nominal_equity: 1_000_000
  paper: true

risk:
  risk_per_trade_pct:      0.0025   # 0.25% -> $2,500 on $1M
  daily_loss_limit_pct:    0.015    # 1.5%  -> $15,000
  trailing_dd_pct:         0.05     # 5% from peak equity (dynamic, not a fixed floor)
  max_position_notional_pct: 0.05   # 5% of equity -> $50,000
  max_concurrent_positions: 10
  max_gross_exposure_pct:  1.50     # 150% of equity
  max_risk_per_bucket_mult: 2.0     # a correlation bucket may hold 2x base risk
  min_reward_risk:         1.5      # reject setups below 1.5R
  # Liquidity caps -- you have to be able to get out.
  max_pct_of_adv:          0.01     # <= 1% of 20-day average daily volume
  max_pct_of_bar_volume:   0.10     # <= 10% of typical 5-minute volume

data:
  # "iex" is free but sees ~2% of consolidated volume, which makes VWAP and any
  # volume-based signal close to noise. "sip" (Algo Trader Plus, $99/mo) is
  # required for the order-flow layer to mean anything.
  feed: iex
  timeframes: ["5Min", "15Min", "1Hour"]
  bias_timeframe: "4Hour"        # resampled from 1Hour, anchored to the RTH open
  lookback_days: 45
  session_tz: "America/New_York"
  rth_open:  "09:30"
  rth_close: "16:00"
  skip_first_minutes: 5          # no entries in the opening auction chaos
  skip_last_minutes:  5

orderflow:
  # Honest proxy for Elder's footprint/DOM work. NOT true depth of book -- see
  # docs/orderflow.md. Requires feed: sip to be worth anything.
  enabled: true
  classify: quote_rule           # quote_rule (Lee-Ready) | tick_rule
  delta_window_minutes: 30
  price_bin_ticks: 1

execution:
  dry_run: true                  # SAFE BY DEFAULT -- --live is required to trade
  scan_interval_minutes: 5
  order_type: bracket            # bracket = entry + TP + SL as one OTOCO order
  time_in_force: day             # brackets require day or gtc

reconcile:
  # Runs on its own thread, far faster than the scan loop, because a close
  # request to Alpaca is a market order and not a guarantee.
  enabled: true
  interval_seconds: 30           # 30-60s is the sensible band
  max_close_attempts: 5          # then halt and demand manual intervention
  stale_order_minutes: 10        # cancel unfilled entries older than this
  auto_protect: true             # flatten any position found without a stop

screening:
  min_price: 10.0
  min_adv_notional: 50_000_000
  full_size_adv_notional: 200_000_000
  max_spread_bps: 5
  min_atr_pct: 0.01
  max_atr_pct: 0.06
  skip_earnings_window_days: 1

strategy:
  # Elder Santis "One and Done": context -> location -> confirmation.
  # Values supplied by the user 2026-09-21; see docs/strategy-spec.md for the
  # two places where they are applied differently from the literal wording, and
  # why (stop_basis and exhaustion direction).

  context:
    structure_timeframe: "4Hour"
    swing_bars: 3                  # fractal half-width: 3 bars either side
    equal_level_tolerance: 0.005   # 0.5% -- three highs within this band are "equal"
    # Bullish = 2 higher lows + 3 higher highs; bearish mirrors; balanced =
    # 3 equal highs + 3 equal lows; anything else -> no predetermined bias.
    bullish_higher_lows: 2
    bullish_higher_highs: 3

  volume_profile:
    timeframe: "30Min"
    value_area_pct: 0.68           # his "68% of the total transaction volume"
    price_bins: 100
    hvn_percentile: 60             # >= 60th pct of volume-at-price = high volume node
    lvn_percentile: 30             # <= 30th pct = low volume node (complement of above)
    va_breakout_bars: 2            # 2 closes outside the value area...
    va_breakout_volume_mult: 1.5   # ...on > 1.5x average volume = acceptance

  zones:
    # "If the move down or up isn't obvious, I suggest you just simply stay away."
    expansion_atr_mult: 2.0        # a move must exceed this x ATR to be "obvious"
    consolidation_max_bars: 10     # how far back to look for the balance before it
    consolidation_atr_mult: 0.75   # bars tighter than this x ATR count as balance
    timeframes: ["4Hour", "1Hour", "30Min", "15Min"]
    timeframe_priority_high_wins: true   # 4H zone beats a conflicting 15m zone
    # How close price must be to a zone edge to engage, in ATR rather than a
    # fixed percent -- a 1% band means something different on SPY than on TSLA.
    # Must allow for the flip bar having already moved ~1 ATR off the zone.
    max_distance_atr: 2.0
    max_touches: 3                 # a zone touched more than this is considered used up

  confirmation:
    # "bars" works on the free IEX feed using bar volume as a proxy for
    # aggressive participation. "orderflow" needs feed: sip and uses classified
    # trade delta -- much closer to what Elder reads on Bookmap.
    mode: bars
    exhaustion_bars: 3             # 3 consecutive pushes into the zone...
    exhaustion_require_declining_volume: true   # ...each on lower volume = exhaustion
    flip_atr_mult: 1.0             # "step up and take control": > 1 ATR move...
    flip_volume_mult: 1.5          # ...on > 1.5x average volume

  exits:
    stop_basis: invalidation       # primary: beyond the swing that invalidates the thesis
    stop_atr_buffer: 0.25          # small ATR cushion beyond that swing
    # Cap on stop width. NOTE the interaction with confirmation.flip_atr_mult:
    # entry is the close of a >= 1.0x ATR flip bar and the stop sits below that
    # bar's low, so structural minimum risk is roughly
    #   flip (1.0) + exhaustion push range (~0.5) + buffer (0.25) = 1.75x ATR.
    # The originally supplied 1.5x sat below that floor and rejected virtually
    # every confirmed setup. 2.5x leaves working headroom while still refusing
    # genuinely wide setups. Lower flip_atr_mult if you want a tighter cap.
    stop_atr_max_mult: 2.5
    target_basis: poc              # POC magnet first, then HVN, then opposing VA edge
    min_reward_risk: 1.5

universe:
  active_tier: starter           # starter | etf_core | equity_large | crypto
